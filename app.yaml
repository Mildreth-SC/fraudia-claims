runtime: python312
service: fraudia-api

env: standard

handlers:
- url: /.*
  script: auto
  secure: always
  redirect_http_response_code: 301

env_variables:
  SUPABASE_URL: ""
  SUPABASE_KEY: ""
  PORT: "8000"

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.65
  target_throughput_utilization: 0.75

vpc_access_connector:
  name: ""

inbound_services:
- warmup
